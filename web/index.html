<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vm visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>pip</header>

    <div id="controls">
        <select id="prog">
            <option value="fib.bin">fibonacci</option>
            <option value="add.bin">2+3</option>
            <option value="ant.bin">langtons ant</option>
            <option value="call.bin">call</option>
            <option value="key.bin">key</option>
        </select>
        <button id="step">step</button>
        <button id="run">run</button>
        <button id="pause">pause</button>
        <button id="reset">reset</button>
        <input type="range" id="speed" min="1" max="2000" value="1">
    </div>

    <div id="die">
        <div class="block" id="rf">
            <span class="label">RF</span>
            <pre id="regs"></pre>
        </div>
        <div class="block" id="ctrl">
            <span class="label">CTRL</span>
            <pre id="ctrlinfo"></pre>
        </div>
        <div class="block" id="alu">
            <span class="label">ALU</span>
            <pre id="aluinfo">idle</pre>
        </div>
        <div class="block" id="stk">
            <span class="label">STACK</span>
            <pre id="stack"></pre>
        </div>
        <div class="block" id="mem">
            <span class="label">MEM</span>
            <canvas id="grid" width="384" height="384"></canvas>
            <pre id="hex"></pre>
        </div>
        <div class="block" id="io">
            <span class="label">I/O</span>
            <pre id="out"></pre>
        </div>
    </div>
    

    <script src="disasm.js"></script>
    <script src="app.js"></script>
    <script src="vm.js"></script>
</body>
</html>
