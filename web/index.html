<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vm visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>pip</header>

    <div id="controls">
        <select id="prog">
            <option value="fib.bin">fibonacci</option>
            <option value="add.bin">2+3</option>
            <option value="ant.bin">langtons ant</option>
            <option value="call.bin">call</option>
        </select>
        <button id="step">step</button>
        <button id="run">run</button>
        <button id="pause">pause</button>
        <button id="reset">reset</button>
        <input type="range" id="speed" min="1" max="2000" value="1">
    </div>

    <div id="view">
        <pre id="out"></pre>
        <canvas id="grid" width="384" height="384"></canvas>
    </div>

    <div id="side">
        <pre id="regs"></pre>
        <pre id="stack"></pre>
    </div>
    

    <script src="disasm.js"></script>
    <script src="app.js"></script>
    <script src="vm.js"></script>
</body>
</html>
